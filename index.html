<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Battle</title>
  <!-- Le "?v=" est à changer à chaque version : il oblige le navigateur à reprendre les
       nouveaux fichiers, au lieu de mélanger cette page avec d'anciens scripts gardés en mémoire. -->
  <link rel="stylesheet" href="css/style.css?v=1.7.1">
</head>
<body class="mode-menu">
  <span id="version" class="texte-version"></span>

  <header id="barre-haut">
    <div id="barre-boutons">
      <span id="info-niveau"></span>
      <span id="bloc-or" title="Or de partie"><span aria-hidden="true">🪙</span> <span id="or-partie">0</span></span>
      <button id="bouton-pause" type="button" data-texte="pause"></button>
      <button id="bouton-recommencer" type="button" data-texte="recommencer"></button>
    </div>
    <div id="barre-parts" role="img" data-texte-aria="partsAria"></div>
  </header>

  <!-- La 3D, puis par-dessus une couche à plat pour les compteurs et les gestes. -->
  <main id="zone-jeu">
    <canvas id="scene3d" aria-hidden="true"></canvas>
    <canvas id="jeu" data-texte-aria="carteAria"></canvas>
  </main>
  <div id="bulle-tutoriel" role="status"></div>
  <div id="roue"></div>
  <div id="fiche" role="status"></div>

  <!-- L'écran titre -->
  <section id="ecran-titre" class="ecran ecran-titre">
    <div class="particules" aria-hidden="true"></div>
    <div id="bloc-pieces" title="Pièces">
      <span aria-hidden="true">🪙</span> <span id="pieces-titre">0</span>
    </div>
    <div class="contenu-titre">
      <h1><span class="mot-titre">Tower</span> <span class="mot-titre">Battle</span></h1>
      <div class="ornement" aria-hidden="true"><span></span><b>✦</b><span></span></div>
      <div class="boutons-titre">
        <button id="bouton-jouer" type="button" class="bouton-principal" data-texte="jouer"></button>
        <button id="bouton-niveaux" type="button" data-texte="niveaux"></button>
        <button id="bouton-collection" type="button" data-texte="collection"></button>
        <button id="bouton-boutique" type="button" data-texte="boutique"></button>
        <button id="bouton-parametres" type="button" data-texte="parametres"></button>
        <button id="bouton-credits" type="button" data-texte="credits"></button>
      </div>
    </div>
  </section>

  <!-- La carte des niveaux -->
  <section id="ecran-niveaux" class="ecran ecran-flou ecran-defilant">
    <div class="panneau-niveaux">
      <div class="entete-niveaux">
        <button type="button" class="bouton-retour" data-texte="retour"></button>
        <h2 id="titre-page"></h2>
      </div>
      <div class="pages-niveaux">
        <button id="page-precedente" type="button" data-texte="pagePrecedente"></button>
        <button id="page-suivante" type="button" data-texte="pageSuivante"></button>
      </div>
      <div id="carte-niveaux"></div>
    </div>
  </section>

  <!-- Les paramètres -->
  <section id="ecran-parametres" class="ecran ecran-flou ecran-defilant">
    <div class="panneau">
      <h2 data-texte="parametres"></h2>
      <label class="reglage">
        <span data-texte="musique"></span>
        <input id="reglage-musique" type="range" min="0" max="100">
      </label>
      <label class="reglage">
        <span data-texte="effets"></span>
        <input id="reglage-effets" type="range" min="0" max="100">
      </label>
      <div class="reglage">
        <span data-texte="vitesse"></span>
        <div class="choix">
          <button type="button" data-vitesse="1">×1</button>
          <button type="button" data-vitesse="2">×2</button>
        </div>
      </div>
      <div class="reglage">
        <span data-texte="langue"></span>
        <div class="choix">
          <button type="button" data-langue="fr" data-texte="francais"></button>
          <button type="button" data-langue="en" data-texte="anglais"></button>
        </div>
      </div>

      <button id="bouton-effacer" type="button" class="bouton-danger" data-texte="effacer"></button>
      <div id="confirmation" hidden>
        <p data-texte="confirmerEffacer"></p>
        <div class="ecran-boutons">
          <button id="effacer-annuler" type="button" data-texte="annuler"></button>
          <button id="effacer-oui" type="button" class="bouton-danger" data-texte="ouiEffacer"></button>
        </div>
      </div>
      <p id="message-sauvegarde" role="status"></p>

      <button type="button" class="bouton-retour" data-texte="retour"></button>
    </div>
  </section>

  <!-- Les crédits -->
  <section id="ecran-credits" class="ecran ecran-flou">
    <div class="panneau">
      <h2 data-texte="credits"></h2>
      <p data-texte="creditsPar"></p>
      <p class="nom-studio">Turbonix Entertainment</p>
      <button type="button" class="bouton-retour" data-texte="retour"></button>
    </div>
  </section>

  <!-- La collection -->
  <section id="ecran-collection" class="ecran ecran-flou ecran-defilant">
    <div class="panneau-large">
      <div class="entete-niveaux">
        <button type="button" class="bouton-retour" data-texte="retour"></button>
        <h2 data-texte="collection"></h2>
      </div>
      <div class="choix">
        <button type="button" data-onglet-collection="tour" data-texte="ongletTours"></button>
        <button type="button" data-onglet-collection="soldat" data-texte="ongletSoldats"></button>
        <span id="compte-collection"></span>
      </div>
      <div id="grille-collection" class="grille-cartes"></div>
    </div>
  </section>

  <!-- La boutique -->
  <section id="ecran-boutique" class="ecran ecran-flou ecran-defilant">
    <div class="panneau-large">
      <div class="entete-niveaux">
        <button type="button" class="bouton-retour" data-texte="retour"></button>
        <h2 data-texte="boutique"></h2>
        <span class="bloc-pieces-petit"><span aria-hidden="true">🪙</span> <span id="pieces-boutique">0</span></span>
      </div>
      <h3 data-texte="skinsTours"></h3>
      <div id="skins-tours" class="grille-cartes"></div>
      <h3 data-texte="skinsSoldats"></h3>
      <div id="skins-soldats" class="grille-cartes"></div>
    </div>
  </section>

  <!-- La présentation d'un nouveau type débloqué -->
  <section id="ecran-deblocage" class="ecran ecran-voile">
    <div class="rayons" aria-hidden="true"></div>
    <div class="particules" aria-hidden="true"></div>
    <div id="deblocage-contenu" class="panneau panneau-deblocage">
      <p id="deblocage-genre"></p>
      <canvas id="vignette-3d" width="256" height="256" aria-hidden="true"></canvas>
      <h2 id="deblocage-nom"></h2>
      <p id="deblocage-description"></p>
      <p id="deblocage-apprendre"></p>
      <button id="deblocage-continuer" type="button" class="bouton-principal" data-texte="continuer"></button>
    </div>
  </section>

  <!-- Le mini menu de pause -->
  <section id="ecran-pause" class="ecran ecran-voile">
    <div class="panneau panneau-petit">
      <h2 data-texte="pause"></h2>
      <p class="texte-version version-menu"></p>
      <button id="pause-reprendre" type="button" class="bouton-principal" data-texte="reprendre"></button>
      <button id="pause-recommencer" type="button" data-texte="recommencer"></button>
      <button id="pause-menu" type="button" data-texte="menu"></button>
    </div>
  </section>

  <!-- La fin de partie -->
  <section id="ecran-fin" class="ecran ecran-voile">
    <div class="rayons" aria-hidden="true"></div>
    <div class="particules" aria-hidden="true"></div>
    <div class="panneau panneau-petit">
      <h2 id="fin-titre"></h2>
      <p id="fin-etoiles"></p>
      <p id="fin-temps"></p>
      <p id="fin-pieces"></p>
      <button id="bouton-suivant" type="button" class="bouton-principal" data-texte="suivant"></button>
      <button id="bouton-rejouer" type="button" data-texte="rejouer"></button>
      <button id="bouton-menu" type="button" data-texte="menu"></button>
    </div>
  </section>

  <!-- Si le navigateur ne sait pas afficher de 3D -->
  <div id="erreur-3d" hidden>
    <p data-texte="erreur3d"></p>
  </div>

  <!-- moteur.js reste en dernier : il lance le jeu quand tout le reste est chargé. -->
  <script src="js/lib/three.min.js?v=1.7.1"></script>
  <script src="js/sauvegarde.js?v=1.7.1"></script>
  <script src="js/textes.js?v=1.7.1"></script>
  <script src="js/sons.js?v=1.7.1"></script>
  <script src="js/donnees-tours.js?v=1.7.1"></script>
  <script src="js/donnees-soldats.js?v=1.7.1"></script>
  <script src="js/donnees-liens.js?v=1.7.1"></script>
  <script src="js/donnees-skins.js?v=1.7.1"></script>
  <script src="js/deblocages.js?v=1.7.1"></script>
  <script src="js/tours.js?v=1.7.1"></script>
  <script src="js/ameliorations.js?v=1.7.1"></script>
  <script src="js/soldats.js?v=1.7.1"></script>
  <script src="js/lignes.js?v=1.7.1"></script>
  <script src="js/tirs.js?v=1.7.1"></script>
  <script src="js/ordi.js?v=1.7.1"></script>
  <script src="js/generateur.js?v=1.7.1"></script>
  <script src="js/tutoriel.js?v=1.7.1"></script>
  <script src="js/niveaux.js?v=1.7.1"></script>
  <script src="js/modeles3d.js?v=1.7.1"></script>
  <script src="js/camera.js?v=1.7.1"></script>
  <script src="js/scene3d.js?v=1.7.1"></script>
  <script src="js/interface-tours.js?v=1.7.1"></script>
  <script src="js/vignettes.js?v=1.7.1"></script>
  <script src="js/collection.js?v=1.7.1"></script>
  <script src="js/boutique.js?v=1.7.1"></script>
  <script src="js/carteniveaux.js?v=1.7.1"></script>
  <script src="js/menu.js?v=1.7.1"></script>
  <script src="js/moteur.js?v=1.7.1"></script>
</body>
</html>
